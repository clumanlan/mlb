<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-label="The seven-layer data and model pipeline, top to bottom. Layer 1, Raw Ingestion, fetch from the MLB Stats API to S3, done. Layer 2, Validation, quality gate before downstream runs, done. Layer 3, Feature Engineering, rolling-window features to S3, in progress. Layer 4, Feature Store, Feast offline S3 and Athena, online DynamoDB, not started. Layer 5, Model Training, XGBoost baseline toward an attention model, in progress. Layer 6, Prediction Pipeline, daily batch inference, lineup aware, not started. Layer 7, MLOps, MLflow, Evidently AI, CloudWatch, not started.">
<style>
  :root{
    --bg:#F1F2F4; --surface:#FFFFFF; --ink:#1B1F27; --ink-soft:#5B6270; --line:#D6D9DE;
    --done:#0E7C6E; --done-soft:#DEEDE8;
    --wip:#9C6B14; --wip-soft:#F3E7CF;
    --todo:#6C7280; --todo-soft:#E8E9EC;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171B; --surface:#1C2027; --ink:#ECEEF2; --ink-soft:#9AA1AE; --line:#2C3138;
      --done:#3FC9B4; --done-soft:#173832;
      --wip:#E0B24F; --wip-soft:#3A2F14;
      --todo:#9AA1AE; --todo-soft:#262B31;
    }
  }
  .bgfill{ fill: var(--bg); }
  .mono{ font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; fill: var(--ink); }
  .sans-soft{ font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink-soft); }
</style>

<rect class="bgfill" x="0" y="0" width="760" height="630"></rect>

<defs>
  <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,0 L5,10 z" fill="var(--ink-soft)"></path>
  </marker>
</defs>

<!-- connecting arrows -->
<line x1="380" y1="80"  x2="380" y2="103" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#arrowDown)"></line>
<line x1="380" y1="168" x2="380" y2="191" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#arrowDown)"></line>
<line x1="380" y1="256" x2="380" y2="279" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#arrowDown)"></line>
<line x1="380" y1="344" x2="380" y2="367" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#arrowDown)"></line>
<line x1="380" y1="432" x2="380" y2="455" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#arrowDown)"></line>
<line x1="380" y1="520" x2="380" y2="543" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#arrowDown)"></line>

<!-- Layer 1 -->
<rect x="24" y="16" width="4" height="64" fill="var(--done)"></rect>
<rect x="20" y="16" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="43" font-size="14" font-weight="600">Layer 1 &#8212; Raw Ingestion</text>
<text class="sans-soft" x="40" y="63" font-size="11">MLB Stats API &#8594; S3 (raw_data/)</text>
<rect x="590" y="37" width="130" height="22" rx="11" fill="var(--done-soft)" stroke="var(--done)" stroke-width="1"></rect>
<text x="655" y="52" text-anchor="middle" font-size="11" fill="var(--done)" class="mono">[done]</text>

<!-- Layer 2 -->
<rect x="24" y="104" width="4" height="64" fill="var(--done)"></rect>
<rect x="20" y="104" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="131" font-size="14" font-weight="600">Layer 2 &#8212; Validation</text>
<text class="sans-soft" x="40" y="151" font-size="11">quality gate before downstream runs</text>
<rect x="590" y="125" width="130" height="22" rx="11" fill="var(--done-soft)" stroke="var(--done)" stroke-width="1"></rect>
<text x="655" y="140" text-anchor="middle" font-size="11" fill="var(--done)" class="mono">[done]</text>

<!-- Layer 3 -->
<rect x="24" y="192" width="4" height="64" fill="var(--wip)"></rect>
<rect x="20" y="192" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="219" font-size="14" font-weight="600">Layer 3 &#8212; Feature Engineering</text>
<text class="sans-soft" x="40" y="239" font-size="11">rolling-window features &#8594; S3 (features/offline/)</text>
<rect x="570" y="213" width="150" height="22" rx="11" fill="var(--wip-soft)" stroke="var(--wip)" stroke-width="1"></rect>
<text x="645" y="228" text-anchor="middle" font-size="11" fill="var(--wip)" class="mono">[in progress]</text>

<!-- Layer 4 -->
<rect x="24" y="280" width="4" height="64" fill="var(--todo)"></rect>
<rect x="20" y="280" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="307" font-size="14" font-weight="600">Layer 4 &#8212; Feature Store</text>
<text class="sans-soft" x="40" y="327" font-size="11">Feast &#8212; offline S3/Athena, online DynamoDB</text>
<rect x="565" y="301" width="155" height="22" rx="11" fill="var(--todo-soft)" stroke="var(--todo)" stroke-width="1"></rect>
<text x="642" y="316" text-anchor="middle" font-size="11" fill="var(--todo)" class="mono">[not started]</text>

<!-- Layer 5 -->
<rect x="24" y="368" width="4" height="64" fill="var(--wip)"></rect>
<rect x="20" y="368" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="395" font-size="14" font-weight="600">Layer 5 &#8212; Model Training</text>
<text class="sans-soft" x="40" y="415" font-size="11">XGBoost baseline &#8594; attention model</text>
<rect x="570" y="389" width="150" height="22" rx="11" fill="var(--wip-soft)" stroke="var(--wip)" stroke-width="1"></rect>
<text x="645" y="404" text-anchor="middle" font-size="11" fill="var(--wip)" class="mono">[in progress]</text>

<!-- Layer 6 -->
<rect x="24" y="456" width="4" height="64" fill="var(--todo)"></rect>
<rect x="20" y="456" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="483" font-size="14" font-weight="600">Layer 6 &#8212; Prediction Pipeline</text>
<text class="sans-soft" x="40" y="503" font-size="11">daily batch inference, lineup-aware</text>
<rect x="565" y="477" width="155" height="22" rx="11" fill="var(--todo-soft)" stroke="var(--todo)" stroke-width="1"></rect>
<text x="642" y="492" text-anchor="middle" font-size="11" fill="var(--todo)" class="mono">[not started]</text>

<!-- Layer 7 -->
<rect x="24" y="544" width="4" height="64" fill="var(--todo)"></rect>
<rect x="20" y="544" width="720" height="64" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"></rect>
<text class="mono" x="40" y="571" font-size="14" font-weight="600">Layer 7 &#8212; MLOps</text>
<text class="sans-soft" x="40" y="591" font-size="11">MLflow, Evidently AI, CloudWatch</text>
<rect x="565" y="565" width="155" height="22" rx="11" fill="var(--todo-soft)" stroke="var(--todo)" stroke-width="1"></rect>
<text x="642" y="580" text-anchor="middle" font-size="11" fill="var(--todo)" class="mono">[not started]</text>
</svg>
