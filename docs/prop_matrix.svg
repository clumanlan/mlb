<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" role="img" aria-label="A grid of plate-appearance classifiers -- hit, walk, home run, strikeout -- crossed with two rollup engines. n_pa_predictor heads the batter-prop column, batters_faced_predictor heads the pitcher-allowed column, with a note that outs recorded is derived arithmetically from batters faced minus hits and walks allowed, not a new model. Batter Hits and Batter Walks are built but evaluated only against realized plate-appearance counts, not a real pre-game prediction, shown as dashed incoming arrows. Batter Home Runs has no classifier built yet. Pitcher Hits Allowed and Pitcher Walks Allowed have both ingredients built but the combination has never been tried, shown as dashed boxes. Pitcher Strikeouts is the only fully wired, production-real rollup, using a predicted batters-faced count and slot expansion, shown as a solid arrow into a solid-bordered box, though it shows no edge against real market odds.">
<style>
  :root{
    --bg:#F1F2F4; --surface:#FFFFFF; --ink:#1B1F27; --ink-soft:#5B6270; --line:#D6D9DE;
    --win:#0E7C6E; --win-soft:#DEEDE8;
    --mix:#9C6B14; --mix-soft:#F3E7CF;
    --loss:#B5473A; --loss-soft:#F5E4DF;
    --void:#8A909B;
    --pitcher-tint: rgba(62,92,118,0.07);
    --batter-tint: rgba(150,110,40,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171B; --surface:#1C2027; --ink:#ECEEF2; --ink-soft:#9AA1AE; --line:#2C3138;
      --win:#3FC9B4; --win-soft:#173832;
      --mix:#E0B24F; --mix-soft:#3A2F14;
      --loss:#E08272; --loss-soft:#3A231F;
      --void:#6A7078;
      --pitcher-tint: rgba(110,150,190,0.10); --batter-tint: rgba(210,160,80,0.10);
    }
  }
  .bgfill{ fill: var(--bg); }
  .mono{ font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; fill: var(--ink); }
  .mono-soft{ font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; fill: var(--ink-soft); }
  .sans-soft{ font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink-soft); }
</style>

<rect class="bgfill" x="0" y="0" width="1150" height="700"></rect>

<defs>
  <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"></path>
  </marker>
  <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"></path>
  </marker>
</defs>

<!-- column tints -->
<rect x="308" y="8" width="342" height="662" rx="12" fill="var(--batter-tint)"></rect>
<rect x="728" y="8" width="342" height="662" rx="12" fill="var(--pitcher-tint)"></rect>

<text class="mono-soft" x="480" y="22" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.06em">BATTER PROP &#183; grouped by batter</text>
<text class="mono-soft" x="900" y="22" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.06em">PITCHER-ALLOWED PROP &#183; grouped by pitcher</text>

<!-- column header engines -->
<rect x="340" y="40" width="280" height="90" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"></rect>
<text class="mono" x="480" y="62" text-anchor="middle" font-size="14" font-weight="600">n_pa_predictor</text>
<text class="sans-soft" x="480" y="79" text-anchor="middle" font-size="10.5">batter's PA count tonight</text>
<rect x="400" y="88" width="160" height="17" rx="8.5" fill="var(--win-soft)" stroke="var(--win)" stroke-width="1"></rect>
<text x="480" y="100" text-anchor="middle" font-size="10" fill="var(--win)" class="mono">real_improvement</text>
<text class="sans-soft" x="480" y="120" text-anchor="middle" font-size="9.5" font-style="italic">threshold locked: 0.85 confidence</text>

<rect x="760" y="40" width="280" height="90" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"></rect>
<text class="mono" x="900" y="62" text-anchor="middle" font-size="14" font-weight="600">batters_faced_predictor</text>
<text class="sans-soft" x="900" y="79" text-anchor="middle" font-size="10.5">pitcher's batters faced tonight</text>
<rect x="820" y="88" width="160" height="17" rx="8.5" fill="var(--win-soft)" stroke="var(--win)" stroke-width="1"></rect>
<text x="900" y="100" text-anchor="middle" font-size="10" fill="var(--win)" class="mono">real_improvement</text>
<text class="sans-soft" x="900" y="120" text-anchor="middle" font-size="9.5" font-style="italic">&#8594; outs recorded = this &#8722; hits &#8722; walks allowed</text>

<!-- row labels -->
<text class="mono" x="290" y="205" text-anchor="end" font-size="15" font-weight="600">HIT</text>
<text class="mono" x="290" y="335" text-anchor="end" font-size="15" font-weight="600">WALK</text>
<text class="mono" x="290" y="465" text-anchor="end" font-size="15" font-weight="600">HOME RUN</text>
<text class="mono" x="290" y="605" text-anchor="end" font-size="15" font-weight="600">STRIKEOUT</text>
<text class="sans-soft" x="290" y="222" text-anchor="end" font-size="10.5">hit_predictor</text>
<text class="sans-soft" x="290" y="352" text-anchor="end" font-size="10.5">bb_predictor</text>
<text class="sans-soft" x="290" y="482" text-anchor="end" font-size="10.5">&#8212; not built &#8212;</text>
<text class="sans-soft" x="290" y="622" text-anchor="end" font-size="10.5">k_predictor</text>

<!-- connector arrows -->
<path d="M480,130 V140 H330 V200 H340" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"></path>
<path d="M480,130 V140 H330 V330 H340" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"></path>
<path d="M900,130 V140 H750 V200 H760" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"></path>
<path d="M900,130 V140 H750 V330 H760" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"></path>
<path d="M900,130 V140 H750 V600 H760" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrowSolid)"></path>

<!-- Batter Hits -->
<rect x="340" y="150" width="280" height="100" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"></rect>
<text class="mono" x="480" y="178" text-anchor="middle" font-size="14" font-weight="600">Batter Hits</text>
<text class="sans-soft" x="480" y="196" text-anchor="middle" font-size="10.5">v1&#8211;v5, PA classifier</text>
<rect x="400" y="207" width="160" height="17" rx="8.5" fill="var(--loss-soft)" stroke="var(--loss)" stroke-width="1"></rect>
<text x="480" y="219" text-anchor="middle" font-size="10" fill="var(--loss)" class="mono">flat vs. naive</text>
<text class="sans-soft" x="480" y="240" text-anchor="middle" font-size="9" font-style="italic">backtest only &#8212; realized PA count</text>

<!-- Batter Walks -->
<rect x="340" y="280" width="280" height="100" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"></rect>
<text class="mono" x="480" y="308" text-anchor="middle" font-size="14" font-weight="600">Batter Walks</text>
<text class="sans-soft" x="480" y="326" text-anchor="middle" font-size="10.5">baseline, PA classifier</text>
<rect x="385" y="337" width="190" height="17" rx="8.5" fill="var(--mix-soft)" stroke="var(--mix)" stroke-width="1"></rect>
<text x="480" y="349" text-anchor="middle" font-size="10" fill="var(--mix)" class="mono">overconfidence_risk</text>
<text class="sans-soft" x="480" y="370" text-anchor="middle" font-size="9" font-style="italic">backtest only &#8212; realized PA count</text>

<!-- Batter Home Runs (not started) -->
<rect x="340" y="410" width="280" height="100" rx="8" fill="var(--surface)" stroke="var(--void)" stroke-width="1.3" stroke-dasharray="1 5" stroke-linecap="round"></rect>
<text class="mono-soft" x="480" y="440" text-anchor="middle" font-size="14" font-weight="600">Batter Home Runs</text>
<text class="sans-soft" x="480" y="458" text-anchor="middle" font-size="10.5">no PA classifier yet</text>
<rect x="410" y="470" width="140" height="17" rx="8.5" fill="none" stroke="var(--void)" stroke-width="1" stroke-dasharray="2 3"></rect>
<text x="480" y="482" text-anchor="middle" font-size="10" fill="var(--void)" class="mono">not started</text>

<!-- Pitcher Hits Allowed (untried) -->
<rect x="760" y="150" width="280" height="100" rx="8" fill="var(--surface)" stroke="var(--ink-soft)" stroke-width="1.4" stroke-dasharray="6 4"></rect>
<text class="mono" x="900" y="178" text-anchor="middle" font-size="14" font-weight="600">Pitcher Hits Allowed</text>
<text class="sans-soft" x="900" y="196" text-anchor="middle" font-size="10.5">same hit_predictor, unused this way</text>
<rect x="810" y="207" width="180" height="17" rx="8.5" fill="none" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 3"></rect>
<text x="900" y="219" text-anchor="middle" font-size="10" fill="var(--ink-soft)" class="mono">ingredients exist</text>
<text class="sans-soft" x="900" y="240" text-anchor="middle" font-size="9" font-style="italic">needs k_predictor's slot-expansion pattern</text>

<!-- Pitcher Walks Allowed (untried) -->
<rect x="760" y="280" width="280" height="100" rx="8" fill="var(--surface)" stroke="var(--ink-soft)" stroke-width="1.4" stroke-dasharray="6 4"></rect>
<text class="mono" x="900" y="308" text-anchor="middle" font-size="14" font-weight="600">Pitcher Walks Allowed</text>
<text class="sans-soft" x="900" y="326" text-anchor="middle" font-size="10.5">same bb_predictor, unused this way</text>
<rect x="810" y="337" width="180" height="17" rx="8.5" fill="none" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 3"></rect>
<text x="900" y="349" text-anchor="middle" font-size="10" fill="var(--ink-soft)" class="mono">ingredients exist</text>
<text class="sans-soft" x="900" y="370" text-anchor="middle" font-size="9" font-style="italic">needs k_predictor's slot-expansion pattern</text>

<!-- Pitcher Strikeouts (built, production-real) -->
<rect x="760" y="540" width="280" height="120" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.2"></rect>
<text class="mono" x="900" y="568" text-anchor="middle" font-size="14" font-weight="600">Pitcher Strikeouts</text>
<text class="sans-soft" x="900" y="586" text-anchor="middle" font-size="10.5">k_predictor v6, tuned XGBoost</text>
<rect x="815" y="597" width="170" height="17" rx="8.5" fill="var(--win-soft)" stroke="var(--win)" stroke-width="1"></rect>
<text x="900" y="609" text-anchor="middle" font-size="10" fill="var(--win)" class="mono">real_improvement</text>
<rect x="785" y="618" width="230" height="17" rx="8.5" fill="var(--loss-soft)" stroke="var(--loss)" stroke-width="1"></rect>
<text x="900" y="630" text-anchor="middle" font-size="10" fill="var(--loss)" class="mono">no edge vs. real market</text>
<text class="sans-soft" x="900" y="650" text-anchor="middle" font-size="9" font-style="italic" fill="var(--win)">only production-real rollup in the repo</text>
</svg>
