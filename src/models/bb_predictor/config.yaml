# Baseline config — bb_predictor (walk probability per PA)
# Run: python baseline/model/run.py (from src/models/bb_predictor/)
bucket: mlbdk
region: us-east-2
target_column: is_walk
task_type: classification
date_column: game_date
time_based_split: true
test_season: 2025   # held-out — never evaluated during development; final eval only in a future train.py
val_season: 2024    # iterate against this during development
metric: pr_auc       # per-PA BB rate is meaningfully lower than K's ~22% base rate — heavier
                      # imbalance, PR-AUC is still the right primary metric for the same reason
secondary_metric: roc_auc
model_name: bb_predictor

# Same split as hit_predictor/k_predictor/n_pa_predictor — this model reuses
# their feature builders directly and should stay comparable.
train_seasons:
  - 2017
  - 2018
  - 2019
  - 2022
  - 2023
  - 2024
  - 2025

# Seasons used to compute last-season rate stats (one season behind each
# train season)
feature_seasons:
  - 2016
  - 2017
  - 2018
  - 2019
  - 2022
  - 2023
  - 2024

drop_columns:
  - gamepk
  - play_id
  - batter_id
  - pitcher_id
  - game_date
